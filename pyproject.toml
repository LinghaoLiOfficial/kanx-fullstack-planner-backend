[project]
name = "kanx-fullstack-planner"
version = "0.1.0"
description = "kanx-fullstack-planner backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.35,<1",
]
[project.optional-dependencies]
workflow = ["cryptography>=45,<47", "temporalio>=1.18,<2"]
ai = ["langchain-core>=1.6,<2", "langchain-openai>=1.0,<2", "langgraph>=1.2,<2", "gradio>=5.49,<7", "langgraph-cli[inmem]>=0.4,<1"]
observability = [
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]
[project.scripts]
kanx_fullstack_planner = "kanx_fullstack_planner.app:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kanx_fullstack_planner"]
[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
exclude = "(^|/)(alembic|tests)/"
